<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <style>
    .title{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#102033}
    .subtitle{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#526173}
    .axis{stroke:#8a9aa8;stroke-width:1}
    .grid{stroke:#dbe4ea;stroke-width:1}
    .label{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#324255}
    .value{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#102033}
    .note{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#607080}
    .scad{fill:#1f6f8b}
    .base{fill:#b9c9d3}
    .bad{fill:#d9b36c}
  </style>
  <rect width="980" height="520" fill="#f8fbff"/>
  <text x="42" y="42" class="title">RAGTruth main comparison</text>
  <text x="42" y="66" class="subtitle">Best paper-facing metrics are highlighted by SCAD-RAG-Calibrated; Accuracy is auxiliary under imbalance.</text>

  <g transform="translate(190,110)">
    <line class="grid" x1="0" y1="300" x2="700" y2="300"/>
    <line class="grid" x1="0" y1="225" x2="700" y2="225"/>
    <line class="grid" x1="0" y1="150" x2="700" y2="150"/>
    <line class="grid" x1="0" y1="75" x2="700" y2="75"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="300"/>
    <line class="axis" x1="0" y1="300" x2="700" y2="300"/>
    <text class="label" x="-45" y="305">0.00</text>
    <text class="label" x="-45" y="230">0.25</text>
    <text class="label" x="-45" y="155">0.50</text>
    <text class="label" x="-45" y="80">0.75</text>

    <text class="label" x="10" y="330">Hall-F1</text>
    <rect class="base" x="20" y="244.4" width="44" height="55.6"/>
    <rect class="scad" x="70" y="239.2" width="44" height="60.8"/>
    <text class="value" x="69" y="232">0.203</text>

    <text class="label" x="185" y="330">Macro-F1</text>
    <rect class="base" x="195" y="172.2" width="44" height="127.8"/>
    <rect class="scad" x="245" y="166.4" width="44" height="133.6"/>
    <text class="value" x="242" y="159">0.445</text>

    <text class="label" x="360" y="330">AUROC</text>
    <rect class="base" x="370" y="135.3" width="44" height="164.7"/>
    <rect class="scad" x="420" y="118.2" width="44" height="181.8"/>
    <text class="value" x="418" y="111">0.606</text>

    <text class="label" x="535" y="330">Risk Corr.</text>
    <rect class="bad" x="545" y="300" width="44" height="0"/>
    <rect class="scad" x="595" y="164.9" width="44" height="135.1"/>
    <text class="value" x="592" y="158">0.450</text>
  </g>
  <rect x="70" y="442" width="16" height="16" class="scad"/><text x="94" y="455" class="label">SCAD-RAG-Calibrated</text>
  <rect x="280" y="442" width="16" height="16" class="base"/><text x="304" y="455" class="label">best non-SCAD baseline per metric</text>
  <rect x="520" y="442" width="16" height="16" class="bad"/><text x="544" y="455" class="label">similarity-only risk correlation is negative</text>
  <text x="42" y="488" class="note">Source: full RAGTruth test, 18,598 sentence-level claims.</text>
</svg>

