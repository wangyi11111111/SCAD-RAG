<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#203040" flood-opacity="0.15"/>
    </filter>
    <style>
      .title{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#102033}
      .small{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#405064}
      .box{fill:#ffffff;stroke:#bfd0dd;stroke-width:1.4;rx:18;filter:url(#shadow)}
      .head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#123047}
      .body{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#415064}
      .num{font:800 14px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
      .circle{fill:#1f6f8b}
      .arrow{stroke:#557085;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .chip{fill:#e8f3f7;stroke:#b6d5df;stroke-width:1;rx:12}
      .chiptext{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#1d5367}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#557085"/>
    </marker>
  </defs>
  <rect width="1180" height="520" fill="url(#bg)"/>
  <text x="44" y="48" class="title">SCAD-RAG: claim-level evidence auditing for knowledge-grounded RAG</text>
  <text x="44" y="76" class="small">Sufficient context + evidence perturbation probes + selective-risk attribution</text>

  <g transform="translate(40,116)">
    <rect class="box" x="0" y="0" width="150" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">1</text>
    <text class="head" x="48" y="31">Claim split</text>
    <text class="body" x="22" y="66">Answer → sentence</text>
    <text class="body" x="22" y="88">level claims</text>
  </g>
  <g transform="translate(200,116)">
    <rect class="box" x="0" y="0" width="150" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">2</text>
    <text class="head" x="48" y="31">Alignment</text>
    <text class="body" x="22" y="66">Top-k evidence</text>
    <text class="body" x="22" y="88">by relevance</text>
  </g>
  <g transform="translate(360,116)">
    <rect class="box" x="0" y="0" width="150" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">3</text>
    <text class="head" x="48" y="31">Relation</text>
    <text class="body" x="22" y="66">Entail / neutral</text>
    <text class="body" x="22" y="88">/ contradiction</text>
  </g>
  <g transform="translate(520,116)">
    <rect class="box" x="0" y="0" width="150" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">4</text>
    <text class="head" x="48" y="31">SC-Gate</text>
    <text class="body" x="22" y="66">Sufficient /</text>
    <text class="body" x="22" y="88">insufficient</text>
  </g>
  <g transform="translate(680,116)">
    <rect class="box" x="0" y="0" width="195" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">5</text>
    <text class="head" x="48" y="31">SCAD score</text>
    <text class="body" x="22" y="66">Rel + Entail - Contra</text>
    <text class="body" x="22" y="88">+ Coverage + Context</text>
  </g>
  <g transform="translate(900,116)">
    <rect class="box" x="0" y="0" width="230" height="122"/>
    <circle class="circle" cx="25" cy="26" r="14"/><text class="num" x="20" y="31">6</text>
    <text class="head" x="48" y="31">Selective risk</text>
    <text class="body" x="22" y="66">Relation / hallucination</text>
    <text class="body" x="22" y="88">attribution / abstain</text>
  </g>

  <path class="arrow" d="M190 177 L200 177"/>
  <path class="arrow" d="M350 177 L360 177"/>
  <path class="arrow" d="M510 177 L520 177"/>
  <path class="arrow" d="M670 177 L680 177"/>
  <path class="arrow" d="M875 177 L900 177"/>

  <g transform="translate(165,305)">
    <rect class="box" x="0" y="0" width="850" height="110"/>
    <text class="head" x="28" y="34">Counterfactual evidence audit as operational robustness probing</text>
    <rect class="chip" x="30" y="58" width="150" height="32"/><text class="chiptext" x="48" y="79">Original: zᵒʳⁱᵍ</text>
    <rect class="chip" x="210" y="58" width="170" height="32"/><text class="chiptext" x="228" y="79">Removal: zʳᵉᵐ</text>
    <rect class="chip" x="410" y="58" width="195" height="32"/><text class="chiptext" x="428" y="79">Hard negative: zʰⁿ</text>
    <rect class="chip" x="635" y="58" width="185" height="32"/><text class="chiptext" x="653" y="79">EDD / HNRG / risk</text>
  </g>
  <path class="arrow" d="M777 238 C777 268,590 280,590 305"/>
  <path class="arrow" d="M590 415 C590 454,965 456,1015 238"/>
</svg>

