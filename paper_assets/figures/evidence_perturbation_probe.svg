<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#51687a"/>
    </marker>
    <style>
      .title{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#102033}
      .box{fill:#fff;stroke:#bdd0dc;stroke-width:1.3;rx:16}
      .head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#123047}
      .text{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#415064}
      .formula{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#1f6f8b}
      .arrow{stroke:#51687a;stroke-width:2;fill:none;marker-end:url(#arr)}
      .score{fill:#e9f4f7;stroke:#a9ced8;rx:12}
    </style>
  </defs>
  <rect width="980" height="420" fill="#f8fbff"/>
  <text x="42" y="44" class="title">Counterfactual evidence audit: score sensitivity, not causal identification</text>
  <g transform="translate(55,90)">
    <rect class="box" x="0" y="0" width="250" height="210"/>
    <text class="head" x="26" y="36">Original evidence view</text>
    <text class="text" x="26" y="76">Top-k retrieved evidence</text>
    <text class="text" x="26" y="102">contains best evidence e*</text>
    <rect class="score" x="26" y="138" width="190" height="42"/>
    <text class="formula" x="52" y="165">zᵒʳⁱᵍ = SCAD(c,E)</text>
  </g>
  <g transform="translate(365,90)">
    <rect class="box" x="0" y="0" width="250" height="210"/>
    <text class="head" x="26" y="36">Removal view</text>
    <text class="text" x="26" y="76">Remove best evidence e*</text>
    <text class="text" x="26" y="102">and recompute score</text>
    <rect class="score" x="26" y="138" width="190" height="42"/>
    <text class="formula" x="52" y="165">EDD = zᵒʳⁱᵍ - zʳᵉᵐ</text>
  </g>
  <g transform="translate(675,90)">
    <rect class="box" x="0" y="0" width="250" height="210"/>
    <text class="head" x="26" y="36">Hard-negative view</text>
    <text class="text" x="26" y="76">Replace e* with a semantically</text>
    <text class="text" x="26" y="102">similar unsupported evidence</text>
    <rect class="score" x="26" y="138" width="198" height="42"/>
    <text class="formula" x="42" y="165">HNRG = zᵒʳⁱᵍ - zʰⁿ</text>
  </g>
  <path class="arrow" d="M305 195 L365 195"/>
  <path class="arrow" d="M615 195 L675 195"/>
  <text x="112" y="346" class="text">Large EDD: decision depends on key evidence.</text>
  <text x="392" y="346" class="text">Large HNRG: detector distinguishes real evidence from hard negatives.</text>
  <text x="112" y="376" class="text">Low EDD/HNRG: raise selective risk or route to manual review.</text>
</svg>

