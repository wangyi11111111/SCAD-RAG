[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scad-rag"
version = "0.1.0"
description = "Sufficient-Context and Counterfactual Audit for RAG Hallucination Attribution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yi Wang", email = "wangy465@cuc.edu.cn" },
    { name = "Wenqian Shang", email = "shangwenqian@cuc.edu.cn" },
]
dependencies = []

[project.optional-dependencies]
default = ["torch", "transformers", "sentence-transformers", "scikit-learn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
